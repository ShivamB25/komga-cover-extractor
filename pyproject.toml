[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "komga-cover-extractor"
version = "2.5.39.dev0"
description = "Komga library organization, release management and cover extraction"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE.md"]
dependencies = [
    "regex==2025.9.18",
    "titlecase==2.4.1",
    "tomli-w>=1.2,<2",
    "unidecode==1.4.0",
]

[project.scripts]
kce = "komga_cover_extractor.cli:main"

[project.optional-dependencies]
covers = [
    "lxml==6.0.2",
    "pillow==12.0.0",
]
image-similarity = [
    "numpy==2.5.3",
    "opencv-python-headless==4.14.0.94",
    "scikit-image==0.26.0",
]
conversion = [
    "filetype==1.2.0",
    "py7zr==1.1.3",
    "rarfile==4.2",
]
watch = [
    "watchdog==6.0.0",
]
integrations = [
    "beautifulsoup4==4.14.2",
    "lxml==6.0.2",
    "requests==2.32.5",
]
all = [
    "beautifulsoup4==4.14.2",
    "filetype==1.2.0",
    "lxml==6.0.2",
    "numpy==2.5.3",
    "opencv-python-headless==4.14.0.94",
    "pillow==12.0.0",
    "py7zr==1.1.3",
    "rarfile==4.2",
    "requests==2.32.5",
    "scikit-image==0.26.0",
    "watchdog==6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/komga_cover_extractor"]
exclude = ["**/__pycache__/**", "**/*.py[cod]"]


[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/README.md",
  "/Dockerfile",
  "/docker-entrypoint.sh",
  "/.dockerignore",
  "/.github/workflows",
  "/komga_cover_extractor.py",
  "/addons/qbit_torrent_unchecker",
  "/requirements.txt",
  "/tools",
  "/pyproject.toml",
  "/uv.lock",
  "/.python-version",
  "/LICENSE.md",
  "/blank_black.png",
  "/blank_white.jpg",
]
exclude = ["**/__pycache__/**", "**/*.py[cod]", "**/.pytest_cache/**"]

[tool.hatch.build.targets.sdist.force-include]
"tests/fixtures/legacy" = "tests/fixtures/legacy"


[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff",
    "mypy",
    "types-regex",
    "hatchling>=1.26,<2",
    "types-requests>=2.32,<2.33",
    "types-beautifulsoup4>=4.12,<4.15",
]
legacy = [
  "beautifulsoup4==4.14.2",
  "discord-webhook==1.4.1",
  "filetype==1.2.0",
  "lxml==6.0.2",
  "numpy>=2.3.2,<3",
  "opencv-python-headless>=4.13,<5",
  "pillow==12.0.0",
  "py7zr>=1.1,<2",
  "rarfile==4.2",
  "regex==2025.9.18",
  "requests==2.32.5",
  "scandir==1.10.0",
  "scikit-image>=0.26,<0.27",
  "titlecase==2.4.1",
  "Unidecode==1.4.0",
  "watchdog==6.0.0",
  "qbittorrent-api==2025.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
include = ["tools/**/*.py", "tests/**/*.py", "src/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
